name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Audit dependencies for known high/critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Type-check and build the app bundle
        run: npm run build

      - name: Verify the built app is the real React app, not a static page
        shell: bash
        run: |
          if ! ls dist/assets/*.js >/dev/null 2>&1; then
            echo "::error::dist/assets contains no JS bundle — index.html is not wired to src/main.tsx"
            exit 1
          fi
